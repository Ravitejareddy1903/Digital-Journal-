      const [toast, setToast] = useState(null);

      // MongoDB & Backend API Connectivity State
      const [backendUrl, setBackendUrl] = useState(() => localStorage.getItem('aura_backend_url') || 'http://localhost:5000');
      const [mongoStatus, setMongoStatus] = useState('checking'); // 'connected', 'offline', 'checking'
      const [showMongoModal, setShowMongoModal] = useState(false);
      const [isTestingMongo, setIsTestingMongo] = useState(false);
      const [mongoServerInfo, setMongoServerInfo] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      // Check MongoDB Backend Connectivity
      const checkMongoConnection = useCallback(async (customUrl) => {
        const url = (customUrl || backendUrl).replace(/\/$/, '');
        setIsTestingMongo(true);
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2500);
          const res = await fetch(`${url}/health`, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            setMongoStatus('connected');
            setMongoServerInfo(data);
            showToast('🍃 Connected to MongoDB via Node.js Backend API!', 'success');
          } else {
            setMongoStatus('offline');
          }
        } catch (err) {
          setMongoStatus('offline');
          setMongoServerInfo(null);
        } finally {
          setIsTestingMongo(false);
        }
      }, [backendUrl]);

      // Initial check on load
      useEffect(() => {
        checkMongoConnection();
      }, [checkMongoConnection]);

      // Sync local entries to MongoDB backend
      const handleSyncToMongo = async () => {
        if (mongoStatus !== 'connected') {
          showToast('Cannot sync: Node.js backend & MongoDB are not reachable yet', 'error');
          return;
        }
        setIsSyncing(true);
        try {
          let count = 0;
          for (const item of entries) {
            await fetch(`${backendUrl}/api/v1/journals`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title: item.title,
                content: item.content,
                mood: item.mood,
                category: item.category,
                tags: item.tags,
                weather: item.weather,
                coverImage: item.coverImage,
                entryDate: item.entryDate
              })
            });
            count++;
          }
          showToast(`Successfully synchronized ${count} entries to MongoDB! 🍃`, 'success');
        } catch (err) {
          showToast('Failed to sync to MongoDB: ' + err.message, 'error');
        } finally {
          setIsSyncing(false);
        }
      };

      // Save entries to localStorage
      useEffect(() => {
        localStorage.setItem('aura_journal_entries', JSON.stringify(entries));
      }, [entries]);

      // Apply theme to document element
      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('aura_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
        showToast(`Theme switched to ${theme === 'dark' ? 'Light' : 'Dark'} mode`, 'info');
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type, id: Date.now() });
        setTimeout(() => setToast(null), 3200);
      };

      // Current active entry
      const activeEntry = useMemo(() => {
        return entries.find(e => e.id === activeEntryId) || entries[0] || null;
      }, [entries, activeEntryId]);

      // Update active entry helper
      const updateActiveEntry = useCallback((fields) => {
        setEntries(prev => prev.map(entry => {
          if (entry.id === activeEntryId) {
            const updated = { ...entry, ...fields };
            // Auto recompute word count
            if (fields.content !== undefined) {
              const words = fields.content.trim().split(/\s+/).filter(Boolean);
              updated.wordCount = words.length;
              updated.readingTimeMinutes = Math.max(1, Math.ceil(words.length / 200));
            }
            return updated;
          }
          return entry;
        }));
      }, [activeEntryId]);

      // Filtered Entries List
      const filteredEntries = useMemo(() => {
        return entries.filter(item => {
          const matchesSearch = searchQuery === '' ||
            item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));

          const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
          const matchesMood = selectedMoodFilter === 'all' || item.mood === selectedMoodFilter;
          const matchesFav = !showFavoritesOnly || item.isFavorite;

          return matchesSearch && matchesCategory && matchesMood && matchesFav;
        }).sort((a, b) => new Date(b.entryDate) - new Date(a.entryDate));
      }, [entries, searchQuery, selectedCategory, selectedMoodFilter, showFavoritesOnly]);

      // Create new journal entry
      const handleCreateNewEntry = () => {
        const newEntry = {
          id: 'entry-' + Date.now(),
          title: 'Untitled Reflection',
          content: '',
          mood: 'peaceful',
          category: 'Personal',
          weather: 'sunny',
          tags: ['Journal'],
          isFavorite: false,
          coverImage: null,
          entryDate: new Date().toISOString(),
          wordCount: 0,
          readingTimeMinutes: 1,
        };
        setEntries([newEntry, ...entries]);
        setActiveEntryId(newEntry.id);
        setActiveView('app');
        showToast('New journal entry ready for your thoughts! ✍️');
      };

      // Delete entry
      const handleDeleteEntry = (id) => {
        if (entries.length <= 1) {
          showToast('Cannot delete the only entry in your journal', 'error');
          return;
        }
        const remaining = entries.filter(e => e.id !== id);
        setEntries(remaining);
        if (activeEntryId === id) {
          setActiveEntryId(remaining[0].id);
        }
        showToast('Journal entry deleted permanently');
      };

      // Toggle favorite
      const handleToggleFavorite = (id) => {
        setEntries(prev => prev.map(e => e.id === id ? { ...e, isFavorite: !e.isFavorite } : e));
      };

      // Writing prompt injection
      const handleInsertPrompt = () => {
        const randomPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
        const currentContent = activeEntry?.content || '';
        const promptBlock = `\n\n> 💡 **Prompt**: ${randomPrompt}\n\n`;
        updateActiveEntry({ content: currentContent + promptBlock });
        showToast('Daily prompt inserted into entry!');
      };

      // Speech-to-Text Voice Dictation using Web Speech API
      const toggleVoiceDictation = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          showToast('Speech recognition not supported in this browser. Try Chrome or Edge!', 'error');
          return;
        }

        if (isListening) {
          recognitionRef.current?.stop();
          setIsListening(false);
          showToast('Voice dictation stopped');
        } else {
          try {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
              setIsListening(true);
              showToast('Listening... Speak naturally into your microphone 🎙️', 'info');
            };

            recognition.onresult = (event) => {
              let transcript = '';
              for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                  transcript += event.results[i][0].transcript + ' ';
                }
              }
              if (transcript) {
                const currentContent = activeEntry?.content || '';
                updateActiveEntry({ content: currentContent + (currentContent ? ' ' : '') + transcript });
              }
            };

            recognition.onerror = (e) => {
              console.error(e);
              setIsListening(false);
              showToast('Dictation error: ' + e.error, 'error');
            };

            recognition.onend = () => {
              setIsListening(false);
            };

            recognitionRef.current = recognition;
            recognition.start();
          } catch (err) {
            console.error(err);
            setIsListening(false);
            showToast('Microphone access denied or unavailable', 'error');
          }
        }
      };

      // Confetti celebration on saving
      const handleSave = () => {
        if (window.confetti) {
          window.confetti({
            particleCount: 50,
            spread: 60,
            origin: { y: 0.8 },
            colors: ['#8b5cf6', '#ec4899', '#3b82f6', '#10b981']
          });
        }
        showToast('Journal entry saved and synchronized! ✨');
      };

      // Export Current Entry as Markdown
      const exportAsMarkdown = () => {
        if (!activeEntry) return;
        const md = `# ${activeEntry.title}\n\n**Date**: ${new Date(activeEntry.entryDate).toLocaleString()}\n**Mood**: ${activeEntry.mood} | **Category**: ${activeEntry.category} | **Weather**: ${activeEntry.weather}\n**Tags**: ${activeEntry.tags.join(', ')}\n\n---\n\n${activeEntry.content}\n`;
        const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${activeEntry.title.replace(/\s+/g, '-').toLowerCase() || 'journal-entry'}.md`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('Exported as Markdown file (.md)');
      };

      // Export All as JSON Backup
      const exportAllJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `aura-journal-backup-${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Complete journal backup downloaded as JSON');
      };

      // Print Entry
      const handlePrint = () => {
        window.print();
      };

      // Unlock with PIN
      const handleUnlock = (e) => {
        e.preventDefault();
        if (pinAttempt === pin) {
          setIsLocked(false);
          setPinAttempt('');
          showToast('Journal unlocked successfully! 🔓');
        } else {
          showToast('Incorrect 4-digit PIN', 'error');
          setPinAttempt('');
        }
      };

      // Set new PIN
      const handleSavePin = () => {
        if (!newPinInput || newPinInput.length !== 4 || !/^\d{4}$/.test(newPinInput)) {
          showToast('PIN must be exactly 4 numeric digits', 'error');
          return;
        }
        setPin(newPinInput);
        localStorage.setItem('aura_journal_pin', newPinInput);
        setShowPinModal(false);
        setNewPinInput('');
        showToast('4-digit privacy PIN activated! 🔒');
      };

      // Remove PIN
      const handleRemovePin = () => {
        setPin('');
        setIsLocked(false);
        localStorage.removeItem('aura_journal_pin');
        setShowPinModal(false);
        showToast('Privacy lock removed');
      };

      // Analytics Calculations
      const analytics = useMemo(() => {
        const totalEntries = entries.length;
        const totalWords = entries.reduce((acc, e) => acc + (e.wordCount || 0), 0);
        const avgWords = totalEntries ? Math.round(totalWords / totalEntries) : 0;

        // Mood breakdown
        const moodCounts = {};
        entries.forEach(e => {
          moodCounts[e.mood] = (moodCounts[e.mood] || 0) + 1;
        });

        // Category breakdown
        const categoryCounts = {};
        entries.forEach(e => {
          categoryCounts[e.category] = (categoryCounts[e.category] || 0) + 1;
        });

        // Calculate consecutive streak days
        const dates = [...new Set(entries.map(e => new Date(e.entryDate).toDateString()))];
        const streak = dates.length; // Simplified streak counter

        // Dominant Mood
        let dominantMood = 'peaceful';
        let maxCount = 0;
        Object.entries(moodCounts).forEach(([mood, count]) => {
          if (count > maxCount) {
            maxCount = count;
            dominantMood = mood;
          }
        });

        return {
          totalEntries,
          totalWords,
          avgWords,
          streak,
          moodCounts,
          categoryCounts,
          dominantMood
        };
      }, [entries]);

      // If Journal is Locked, show PIN Lock Screen
      if (isLocked) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="glass-panel p-8 rounded-3xl max-w-md w-full text-center shadow-2xl relative overflow-hidden border border-white/20">
              <div className="w-16 h-16 rounded-2xl bg-brand-500/10 text-brand-400 mx-auto flex items-center justify-center mb-6">
                <Icon name="lock" size={32} />
              </div>
              <h2 className="text-2xl font-bold font-serif mb-2 text-slate-900 dark:text-white">Aura Journal Locked</h2>
              <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">
                Your thoughts and memories are private. Enter your 4-digit security PIN to unlock.
              </p>

              <form onSubmit={handleUnlock} className="space-y-4">
                <div className="flex justify-center gap-3">
                  {[0, 1, 2, 3].map((idx) => (
                    <div
                      key={idx}
                      className={`w-12 h-14 rounded-xl border flex items-center justify-center text-2xl font-mono font-bold transition-all ${
                        pinAttempt.length > idx
                          ? 'border-brand-500 bg-brand-500/10 text-brand-400 shadow-sm'
                          : 'border-slate-300 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 text-transparent'
                      }`}
                    >
                      {pinAttempt.length > idx ? '•' : ''}
                    </div>
                  ))}
                </div>

                <input
                  type="password"
                  maxLength="4"
                  autoFocus
                  value={pinAttempt}
                  onChange={(e) => {
                    const val = e.target.value.replace(/\D/g, '');
                    setPinAttempt(val);
                  }}
                  className="w-full text-center tracking-widest text-lg py-2.5 px-4 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500"
                  placeholder="Enter 4-digit PIN"
                />

                <button
                  type="submit"
                  className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-medium shadow-lg hover:shadow-brand-500/25 transition-all flex items-center justify-center gap-2"
                >
                  <Icon name="unlock" size={18} />
                  <span>Unlock Journal</span>
                </button>
              </form>

              <p className="text-xs text-slate-400 mt-6">
                Default demo PIN: <span className="font-mono font-semibold text-brand-400">If you forgot it, enter the PIN you configured or reset in developer mode.</span>
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col min-h-screen">
          {/* --- TOP NAVBAR --- */}
          <header className="glass-panel sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 px-4 sm:px-6 py-3 transition-colors">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              
              {/* Brand Logo & Title */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-lg shadow-brand-500/20">
                  <Icon name="book" size={20} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-lg tracking-tight bg-gradient-to-r from-slate-900 via-brand-600 to-indigo-600 dark:from-white dark:via-slate-200 dark:to-brand-400 bg-clip-text text-transparent">
                      Aura Journal
                    </span>
                    <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-brand-500/10 text-brand-500 dark:text-brand-400 border border-brand-500/20 uppercase tracking-wider">
                      MERN Edition
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500 dark:text-slate-400 hidden sm:block">
                    Full-Stack Digital Journal Application & Architectural Showcase
                  </p>
                </div>
              </div>

              {/* View Navigation Switcher */}
              <div className="flex items-center bg-slate-200/70 dark:bg-slate-800/70 p-1 rounded-2xl border border-slate-300/50 dark:border-slate-700/50 text-xs font-medium">
                <button
                  onClick={() => setActiveView('app')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl transition-all ${
                    activeView === 'app'
                      ? 'bg-white dark:bg-slate-900 text-brand-600 dark:text-brand-400 shadow-sm font-semibold'
                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  <Icon name="book" size={15} />
                  <span>Journal Studio</span>
                </button>

                <button
                  onClick={() => setActiveView('analytics')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl transition-all ${
                    activeView === 'analytics'
                      ? 'bg-white dark:bg-slate-900 text-brand-600 dark:text-brand-400 shadow-sm font-semibold'
                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  <Icon name="chart" size={15} />
                  <span>Mood & Insights</span>
                </button>

                <button
                  onClick={() => setActiveView('architecture')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl transition-all ${
                    activeView === 'architecture'
                      ? 'bg-white dark:bg-slate-900 text-brand-600 dark:text-brand-400 shadow-sm font-semibold'
                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  <Icon name="layers" size={15} />
                  <span>Full-Stack Topics</span>
                </button>

                <button
                  onClick={() => setActiveView('api-tester')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl transition-all ${
                    activeView === 'api-tester'
                      ? 'bg-white dark:bg-slate-900 text-brand-600 dark:text-brand-400 shadow-sm font-semibold'
                      : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  <Icon name="server" size={15} />
                  <span>REST API & Mongo</span>
                </button>
              </div>

              {/* Utility Actions */}
              <div className="flex items-center gap-2">
                
                {/* Live MongoDB Status & Connect Button */}
                <button
                  onClick={() => setShowMongoModal(true)}
                  title="MongoDB & Backend Connection Status (Click to configure)"
                  className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-xs font-medium transition-all ${
                    mongoStatus === 'connected'
                      ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-600 dark:text-emerald-400'
                      : 'bg-amber-500/10 border-amber-500/30 text-amber-600 dark:text-amber-400 hover:bg-amber-500/20'
                  }`}
                >
                  <span className={`w-2 h-2 rounded-full ${
                    mongoStatus === 'connected' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'
                  }`} />
                  <span className="hidden sm:inline">
                    {mongoStatus === 'connected' ? 'MongoDB: Connected' : 'MongoDB: Local Mode'}
                  </span>
                  <span className="sm:hidden">DB</span>
                </button>
                {/* Security PIN Lock toggle */}
                <button
                  onClick={() => setShowPinModal(true)}
                  title={pin ? 'PIN Lock Enabled (Click to manage)' : 'Set Privacy PIN Lock'}
                  className={`p-2 rounded-xl border transition-all ${
                    pin
                      ? 'bg-brand-500/10 border-brand-500/30 text-brand-500'
                      : 'border-slate-300 dark:border-slate-700 text-slate-500 hover:text-slate-900 dark:hover:text-white'
                  }`}
                >
                  <Icon name={pin ? "lock" : "unlock"} size={17} />
                </button>

                {/* Export Data */}
                <button
                  onClick={exportAllJSON}
                  title="Export All Journal Entries as JSON"
                  className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-500 hover:text-slate-900 dark:hover:text-white transition-all hidden md:flex items-center"
                >
                  <Icon name="download" size={17} />
                </button>

                {/* Dark / Light Mode Toggle */}
                <button
                  onClick={toggleTheme}
                  title={`Toggle ${theme === 'dark' ? 'Light' : 'Dark'} Mode`}
                  className="p-2 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-500 hover:text-slate-900 dark:hover:text-white transition-all"
                >
                  <Icon name={theme === 'dark' ? "sun" : "moon"} size={17} />
                </button>

                {/* Create Entry Button */}
                <button
                  onClick={handleCreateNewEntry}
                  className="flex items-center gap-1.5 py-2 px-3.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-medium text-xs sm:text-sm shadow-md hover:shadow-brand-500/25 transition-all transform active:scale-95"
                >
                  <Icon name="plus" size={16} />
                  <span className="hidden sm:inline">New Entry</span>
                </button>
              </div>

            </div>
          </header>

          {/* --- MAIN BODY CONTENT AREA --- */}
          <main className="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6 flex flex-col">
            
            {/* VIEW 1: JOURNAL STUDIO (ACTIVE APP) */}
            {activeView === 'app' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 items-start">
                
                {/* LEFT COLUMN: ENTRIES SIDEBAR & FILTERING */}
                <aside className="lg:col-span-4 flex flex-col gap-4">
                  
                  {/* Search and Filters Header */}
                  <div className="glass-panel p-4 rounded-3xl space-y-3.5 shadow-sm">
                    
                    {/* Live Search Input */}
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <Icon name="search" size={16} />
                      </div>
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search title, thoughts, or #tags..."
                        className="w-full pl-10 pr-4 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500/50"
                      />
                      {searchQuery && (
                        <button
                          onClick={() => setSearchQuery('')}
                          className="absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-slate-400 hover:text-slate-600"
                        >
                          ✕
                        </button>
                      )}
                    </div>

                    {/* Category Filter Pills */}
                    <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
                      {CATEGORIES.map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-2.5 py-1 rounded-lg whitespace-nowrap transition-all ${
                            selectedCategory === cat
                              ? 'bg-brand-500 text-white font-medium shadow-sm'
                              : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    {/* Mood & Favorite Quick Toggles */}
                    <div className="flex items-center justify-between pt-1 border-t border-slate-200/60 dark:border-slate-800/60 text-xs">
                      <div className="flex items-center gap-1">
                        <span className="text-[11px] text-slate-400 mr-1">Mood:</span>
                        <select
                          value={selectedMoodFilter}
                          onChange={(e) => setSelectedMoodFilter(e.target.value)}
                          className="bg-transparent text-slate-700 dark:text-slate-300 text-xs focus:outline-none cursor-pointer"
                        >
                          <option value="all">All Moods</option>
                          {MOODS.map(m => (
                            <option key={m.id} value={m.id} className="dark:bg-slate-900 text-slate-900 dark:text-white">
                              {m.emoji} {m.label}
                            </option>
                          ))}
                        </select>
                      </div>

                      <button
                        onClick={() => setShowFavoritesOnly(!showFavoritesOnly)}
                        className={`flex items-center gap-1 px-2 py-0.5 rounded-lg border transition-all ${

        ANALYTICS: {
          method: 'GET',
          path: '/api/v1/journals/analytics/summary',
          description: 'MongoDB multi-stage aggregation pipeline calculating mood stats and streaks',
          mongoQuery: `db.journals.aggregate([
  { $match: { user: ObjectId("665a...") } },
  { $group: { _id: "$mood", count: { $sum: 1 } } },
  { $sort: { count: -1 } }
])`,
          response: {
            success: true,
            analytics: {
              totalEntries: entries.length,
              totalWords: entries.reduce((a, b) => a + (b.wordCount || 0), 0),
              currentStreakDays: 4,
              moodDistribution: [
                { _id: 'peaceful', count: 3 },
                { _id: 'inspired', count: 2 },
                { _id: 'grateful', count: 1 }
              ]
            }
          }
        },
        TOGGLE_FAV: {
          method: 'PATCH',
          path: '/api/v1/journals/:id/favorite',
          description: 'Atomic update toggling entry favorite bookmark',
          mongoQuery: 'db.journals.updateOne({ _id: ObjectId("...") }, { $set: { isFavorite: true } })',
          response: {
            success: true,
            message: 'Journal marked as favorite',
            isFavorite: true
          }
        }
      };

      const curr = ENDPOINTS[selectedEndpoint];

      return (
        <div className="space-y-6">
          <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-200/80 dark:border-slate-800/80">
            <h2 className="text-2xl font-bold font-serif text-slate-900 dark:text-white">
              Interactive REST API & MongoDB Simulator
            </h2>
            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-2xl leading-relaxed">
              Test live simulated HTTP requests to the Node.js Express backend and preview the corresponding MongoDB Mongoose queries and database aggregations.
            </p>

            {/* Endpoint Selector Tabs */}
            <div className="flex flex-wrap items-center gap-2 mt-6">
              {Object.keys(ENDPOINTS).map(key => {
                const ep = ENDPOINTS[key];
                const isSelected = selectedEndpoint === key;
                return (
                  <button
                    key={key}
                    onClick={() => {
                      setSelectedEndpoint(key);
                      setResponseLatency(Math.floor(Math.random() * 15) + 8);
                    }}
                    className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-mono transition-all ${
                      isSelected
                        ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 font-bold shadow-md'
                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'
                    }`}
                  >
                    <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${
                      ep.method === 'GET' ? 'bg-blue-500 text-white' :
                      ep.method === 'POST' ? 'bg-emerald-500 text-white' :
                      ep.method === 'PATCH' ? 'bg-amber-500 text-white' : 'bg-rose-500 text-white'
                    }`}>
                      {ep.method}
                    </span>
                    <span>{ep.path}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left: Endpoint Spec & MongoDB Query */}
            <div className="lg:col-span-5 glass-panel p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 space-y-4">
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                  Target Endpoint
                </span>
                <span className="text-xs font-mono text-emerald-500 flex items-center gap-1">
                  ● 200 OK ({responseLatency}ms)
                </span>
              </div>

              <div className="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-mono text-xs text-slate-800 dark:text-slate-200">
                <span className="text-brand-500 font-bold mr-2">{curr.method}</span>
                <span>{curr.path}</span>
              </div>

              <p className="text-xs text-slate-500 dark:text-slate-400">
                {curr.description}
              </p>

              <div className="pt-3 border-t border-slate-200/60 dark:border-slate-800/60 space-y-2">
                <div className="flex items-center justify-between text-xs font-mono text-slate-400">
                  <span>🍃 MongoDB Operation</span>
                  <span className="text-[11px] text-teal-400">Mongoose 8.x</span>
                </div>
                <pre className="p-3.5 rounded-xl bg-slate-900 text-teal-300 font-mono text-xs overflow-x-auto leading-relaxed border border-slate-800">
                  <code>{curr.mongoQuery}</code>
                </pre>
              </div>
            </div>

            {/* Right: JSON Response Payload */}
            <div className="lg:col-span-7 glass-panel p-6 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 space-y-3">
              <div className="flex items-center justify-between text-xs pb-2 border-b border-slate-200/60 dark:border-slate-800/60">
                <span className="font-mono text-slate-400">HTTP Response Body (application/json)</span>
                <span className="text-[11px] font-mono text-slate-400">Content-Length: ~{JSON.stringify(curr.response).length} bytes</span>
              </div>

              <pre className="p-4 rounded-2xl bg-slate-950 text-slate-200 font-mono text-xs max-h-[380px] overflow-y-auto leading-relaxed border border-slate-800 shadow-inner">
                <code>{JSON.stringify(curr.response, null, 2)}</code>
              </pre>
            </div>

          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
